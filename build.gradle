plugins {
    id 'com.android.library'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    namespace 'com.iiab.networkinspector'
    compileSdk 36

    defaultConfig {
        minSdk 28
        targetSdk 36

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        compose true
    }

    publishing {
        singleVariant('release')
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.3.10"

    // OkHttp for interceptor types
    implementation "com.squareup.okhttp3:okhttp:4.9.0"

    // Optional Retrofit support for converter error inspection
    compileOnly "com.squareup.retrofit2:retrofit:2.9.0"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.3.8"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.3.8"

    // Room for log persistence (KSP avoids kapt + Kotlin 2.1 metadata mismatch)
    implementation "androidx.room:room-runtime:2.8.4"
    ksp "androidx.room:room-compiler:2.8.4"
    implementation "androidx.room:room-ktx:2.8.4"

    // Koin for DI
    implementation(platform("io.insert-koin:koin-bom:3.5.0"))
    implementation("io.insert-koin:koin-android")
    implementation("io.insert-koin:koin-core")

    // Compose runtime and UI basics
    implementation platform("androidx.compose:compose-bom:2025.10.00")
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material:material'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation "androidx.activity:activity-compose:1.12.0"

    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Notifications / core
    implementation "androidx.core:core-ktx:1.13.1"
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = "com.github.mosazaid"
                artifactId = "AndroidNetworkInspector"
                version = "1.0.0"
            }
        }
    }
}
